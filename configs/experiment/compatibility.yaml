# @package _global_
defaults:
  - override /data: polyvore-519
  - override /data/readers: resnet34_nn
  - override /data/dataset@data.train.dataset: npair_randmix
  - override /data/dataset@data.valid.dataset: pointwise_randmix
  - override /data/dataset@data.test.dataset: pointwise_randmix
  - override /model: model_r
  - override /optimizer: sgd
  - override /scheduler: plateau
  - override /task: compatibility
  - override /task/eval: [compatibility, fitb]
  - _self_

model:
  num_points: 4
  use_dense_o: true
  use_g_lambda: true

data:
  train:
    dataset:
      data_param:
        mp_workers: 0

task:
  num_runs: 10
