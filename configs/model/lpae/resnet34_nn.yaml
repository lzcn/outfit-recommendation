defaults:
  - lpae/base
  - backbone: resnet34 # backbone for feature extractor
  - _self_

embd_dim: 128
use_u_anchors: true
use_g_anchors: true
use_u_lambda: false
use_g_lambda: false
use_z_score: false
num_sab: 2
num_points: 0
num_seeds: 1
num_anchors: 1
num_heads: 4
use_semantic: false
use_visual: true
use_nn_feature: true
logdet: false
num_o_neg: 32
kappa_u: 1.0
kappa_i: 10.0
type_encoding: learnable
use_cl_u: false
loss_type: "n-pair"
# loss_weight: { nll_c: 1.0, nll_d: 1.0, cl_o: 1.0, cl_u: null, reg: 1.0e-2 }
loss_weight: { nll_c: 1.0, nll_d: 1.0, cl_o: 1.0, cl_u: null, reg: null }
